name: Check FastAPI laboratory work

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run database and FastAPI tests
        run: python -m pytest -v --junitxml=reports/pytest.xml
      - name: Check application security with Bandit
        if: ${{ !cancelled() }}
        run: python -m bandit -r app -ll -f txt | tee reports/bandit.txt
        shell: bash
      - name: Save quality reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: reports/
